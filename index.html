.foot { padding-top: 24px; padding-bottom: 40px; border-top: 1px solid var(--line); color: var(--mut); font-size: .84rem; display: flex; flex-direction: column; gap: 6px; text-wrap: pretty; } .foot .mut { color: var(--mut2); }

}

/* ================= motion + print ================= */

  :root, :root[data-theme="dark"] { --bg: #fff; --bg2: #f6f8fa; --surface: #fff; --surface2: #f6f8fa; --surface3: #e8edf2; --line: #d0d7de; --line2: #b6c0ca; --text: #111; --mut: #444; --mut2: #666; --accent: #0b6a5d; --shadow: none; --glow: none; --grid: none; --mark: #ffe08a; --v-clean: #0b7a4f; --v-low: #0b5f8f; --v-suspicious: #8a5700; --v-malicious: #b23a08; --v-critical: #a81818; --v-test: #5b21b6; --v-unknown: #444; --sev-crit: #a81818; --sev-high: #b23a08; --sev-med: #8a5700; --sev-low: #0b5f8f; --sev-info: #555; }
  body { background: #fff !important; font-size: 11pt; }

  a { color: inherit; }
}

.susb.kw { border-left-color: var(--sev-low); } .susb.m-med { border-left-color: var(--sev-med); } .susb.m-crit { border-left-color: var(--sev-crit); } .susb:hover { border-color: var(--accent); }

.cbar { display: flex; flex-wrap: wrap; gap: 8px; } .legend { margin: 0; }

.cnote { display: flex; gap: 8px; align-items: flex-start; padding: 5px 12px 6px 68px; font: .76rem/1.45 var(--sans); color: var(--text); border-left: 4px solid transparent; position: sticky; left: 0; }
.cnote .ic { margin-top: 2px; flex: none; } .cnote span { white-space: normal; max-width: 70ch; min-width: 220px; }
.cnote.m-crit, .cnote.m-high { border-left-color: var(--sev-high); color: var(--sev-high); background: color-mix(in srgb, var(--sev-high) 8%, var(--bg2)); }
.cnote.m-med { border-left-color: var(--sev-med); color: var(--sev-med); background: color-mix(in srgb, var(--sev-med) 8%, var(--bg2)); }
.cnote.m-low, .cnote.m-info { border-left-color: var(--sev-low); color: var(--mut); background: var(--bg2); }
.cgrp { min-width: max-content; } .more { align-self: flex-start; }
.pu { margin-bottom: 8px; }
@media (max-width: 640px) { .cview { font-size: .74rem; max-height: 440px; } .cl .ln { width: 44px; padding: 0 8px 0 4px; } .cnote { padding-left: 52px; } }
/* ===== Multi-engine tab ===== */
.note.wide { max-width: none; }
.ev { display: inline-flex; padding: 2px 10px; border-radius: 99px; font-size: .76rem; font-weight: 800; color: var(--v, var(--mut)); background: color-mix(in srgb, var(--v, var(--mut)) 14%, var(--surface2)); border: 1px solid color-mix(in srgb, var(--v, var(--mut)) 40%, transparent); white-space: nowrap; }
.sentbox { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface2); border: 1px dashed var(--line2); } .sentbox code { font-size: .84rem; }
.lbl.blk { display: block; margin: 12px 0 6px; font-size: .84rem; font-weight: 700; color: var(--mut); }
.vtres { display: flex; flex-direction: column; gap: 14px; margin-bottom: 10px; }
.vtsum { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--v) 45%, var(--line)); background: color-mix(in srgb, var(--v) 10%, var(--surface2)); }
.vtn { font: 800 1.9rem/1 var(--sans); color: var(--v); white-space: nowrap; } .vtn span { font-size: 1.1rem; color: var(--mut); } .vtt { display: flex; flex-direction: column; gap: 2px; }
.card.unk { background: var(--surface2); box-shadow: none; }
@media print { .codegrid { display: block; } .units, .cview { max-height: none; } }</style>

  ransomware: ['แรนซัมแวร์ (เรียกค่าไถ่)', 'Ransomware', 'เข้ารหัสไฟล์ในเครื่องและเครือข่ายจนเปิดไม่ได้ แล้ววางไฟล์ข้อความเรียกค่าไถ่ให้จ่ายเงิน (มักเป็นคริปโต) เพื่อแลกกับคีย์ถอดรหัส หลายตัวลบ Shadow Copy ก่อนเพื่อไม่ให้กู้ไฟล์คืนได้ และบางตัวแพร่เองผ่านเครือข่าย', 'Encrypts files on the machine and network so they cannot be opened, then leaves a note demanding payment (usually crypto) for the key. Many delete shadow copies first so files cannot be restored, and some spread by themselves across the network.', 'ตัดเครือข่ายทันที อย่าจ่ายเงินก่อนปรึกษาผู้เชี่ยวชาญ กู้จากข้อมูลสำรองที่แยกไว้ และแจ้งผู้ดูแลระบบ', 'Disconnect the machine at once. Do not pay before talking to an expert. Restore from an offline backup and tell your administrator.'],
  trojan: ['โทรจัน / ตัวโหลดมัลแวร์', 'Trojan / dropper', 'ปลอมตัวเป็นไฟล์ปกติ เมื่อรันแล้วจะดาวน์โหลดหรือแตกไฟล์มัลแวร์ตัวอื่นมาติดตั้ง ฝังตัวให้เปิดทุกครั้งที่เปิดเครื่อง และอาจปิดระบบป้องกันของ Windows', 'Pretends to be a normal file. Once run it downloads or unpacks other malware, installs itself to start with the machine, and may switch off Windows protection.', 'อย่ารันไฟล์ ลบทิ้ง ถ้าเคยรันแล้วให้สแกนทั้งเครื่องและตรวจรายการที่เริ่มพร้อมเครื่อง', 'Do not run it, delete it. If it was run, scan the whole machine and review the startup entries.'],
  rat: ['RAT / แบ็คดอร์ (ควบคุมเครื่องจากระยะไกล)', 'RAT / backdoor', 'เปิดช่องให้ผู้โจมตีสั่งงานเครื่องจากระยะไกล เช่น ดูหน้าจอ เปิดกล้อง ดึงไฟล์ รันคำสั่ง โดยเชื่อมต่อออกไปหาเซิร์ฟเวอร์ควบคุม (C2) เพื่อหลบไฟร์วอลล์', 'Gives an attacker remote control: watch the screen, use the camera, take files, run commands. It connects out to a command-and-control (C2) server to get past firewalls.', 'ตัดเครือข่าย สแกนทั้งเครื่อง เปลี่ยนรหัสผ่านทั้งหมดจากเครื่องอื่น และพิจารณาลงระบบใหม่', 'Disconnect, scan the whole machine, change all passwords from another device and consider reinstalling the system.'],
  stealer: ['มัลแวร์ขโมยข้อมูล (Infostealer)', 'Infostealer', 'ค้นรหัสผ่านที่เบราว์เซอร์จำไว้ คุกกี้ล็อกอิน กระเป๋าคริปโต และโทเคนแอป แล้วส่งออกไปให้ผู้โจมตีผ่าน Telegram, Discord หรือเซิร์ฟเวอร์ของตัวเอง', 'Looks for passwords saved in browsers, login cookies, crypto wallets and app tokens, then sends them to the attacker through Telegram, Discord or their own server.', 'เปลี่ยนรหัสผ่านและออกจากระบบทุกอุปกรณ์จากเครื่องอื่น เปิดการยืนยันตัวตนสองชั้น และย้ายเหรียญคริปโตไปกระเป๋าใหม่', 'Change passwords and sign out everywhere from another device, turn on two-factor authentication and move crypto to a new wallet.'],
  miner: ['มัลแวร์ขุดเหรียญ', 'Cryptominer', 'แอบใช้ CPU/GPU ของเครื่องขุดคริปโต (มักเป็น Monero) ทำให้เครื่องช้า ร้อน และค่าไฟสูง โดยเชื่อมต่อพูลขุดผ่านโปรโตคอล Stratum', 'Secretly uses the CPU/GPU to mine crypto (often Monero), making the machine slow, hot and costly to run. It connects to a mining pool over the Stratum protocol.', 'ลบไฟล์ ตรวจตัวตั้งเวลา (scheduled tasks) และรายการเริ่มระบบ แล้วดูการใช้ CPU ผิดปกติ', 'Delete the file, review scheduled tasks and startup items, and watch for abnormal CPU use.'],
  botnet: ['บอตเน็ต', 'Botnet', 'ดึงอุปกรณ์เข้าเครือข่ายของผู้โจมตี มักสแกนหาอุปกรณ์ IoT ที่ใช้รหัสผ่านเริ่มต้น แล้วใช้ส่งทราฟฟิกท่วมเว็บไซต์ (DDoS) หรือส่งสแปม', 'Enrols the device in an attacker-run network. It often scans for IoT devices with default passwords and is used for DDoS floods or spam.', 'ถอดอุปกรณ์ออกจากเครือข่าย รีเซ็ตเป็นค่าโรงงาน เปลี่ยนรหัสผ่านเริ่มต้น และอัปเดตเฟิร์มแวร์', 'Take the device off the network, factory reset it, change default passwords and update the firmware.'],
  webshell: ['เว็บเชลล์ (Web shell)', 'Web shell', 'สคริปต์ที่แอบฝังบนเว็บเซิร์ฟเวอร์ ผู้โจมตีส่งคำสั่งผ่านเว็บเบราว์เซอร์เพื่อรันคำสั่งบนเซิร์ฟเวอร์ ดูหรือแก้ไฟล์ และใช้เป็นฐานโจมตีต่อ', 'A script hidden on a web server. The attacker sends commands through a browser to run code on the server, read or change files, and use it as a base for further attacks.', 'ลบไฟล์ ตรวจว่าเข้ามาทางช่องโหว่ใด อุดช่องโหว่ เปลี่ยนรหัสผ่านและคีย์ทั้งหมดของเซิร์ฟเวอร์ และตรวจ log', 'Remove the file, find the vulnerability it came through and fix it, rotate every server password and key, and review the logs.'],
  macro: ['มาโครอันตราย', 'Malicious macro', 'เอกสาร Office ที่มีโค้ดมาโครสั่งรันเองเมื่อเปิดไฟล์หรือเมื่อกด "Enable content" แล้วเรียก PowerShell หรือดาวน์โหลดมัลแวร์ตัวหลัก เป็นวิธียอดนิยมของอีเมลหลอกลวง', 'An Office document with macro code that runs when opened or when you press "Enable content", then calls PowerShell or downloads the main malware. A favourite of scam emails.', 'อย่ากด Enable content ปิดเอกสารโดยไม่เปิดมาโคร และลบอีเมลต้นทาง', 'Do not press Enable content. Close the document without enabling macros and delete the original email.'],
  exploit: ['ไฟล์ที่ใช้ช่องโหว่ (Exploit)', 'Exploit', 'ไฟล์ที่ออกแบบให้โปรแกรมเปิดไฟล์ (เช่น PDF, Word, ตัวแตกไฟล์) ทำงานผิดพลาดแล้วรันโค้ดของผู้โจมตี โดยผู้ใช้เพียงเปิดไฟล์', 'A file crafted to make the program that opens it (PDF reader, Word, an unzipper) fail in a way that runs the attacker\'s code, just by opening the file.', 'อย่าเปิดด้วยโปรแกรมจริง อัปเดตโปรแกรมที่เกี่ยวข้อง และตรวจในเครื่องเสมือน', 'Do not open it with a real program. Update the related software and examine it in a virtual machine.'],
  hacktool: ['เครื่องมือเจาะระบบ (Hacktool)', 'Hacking tool', 'เครื่องมือที่ใช้ขโมยรหัสผ่าน ยกระดับสิทธิ์ หรือเคลื่อนย้ายในเครือข่าย ทีมทดสอบเจาะระบบใช้ได้ แต่ผู้โจมตีจริงก็ใช้ ถ้าคุณไม่ได้ตั้งใจมีมัน ถือว่าเป็นสัญญาณอันตราย', 'Tools used to steal passwords, raise privileges or move across a network. Pentesters use them, and so do real attackers. If you did not mean to have it, treat it as a danger sign.', 'ถ้าไม่ได้ใช้ในงานทดสอบที่ได้รับอนุญาต ให้ลบและตรวจหาร่องรอยการบุกรุก', 'Unless it is part of an authorised test, remove it and look for signs of intrusion.'],
  script: ['สคริปต์น่าสงสัย', 'Suspicious script', 'สคริปต์ (PowerShell, VBScript, JavaScript, Batch) ที่ซ่อนคำสั่งไว้ด้วยการเข้ารหัสหรือเรียกใช้เครื่องมือของระบบ (certutil, mshta ฯลฯ) เพื่อดาวน์โหลดและรันโค้ดโดยไม่ให้สังเกตเห็น', 'A script (PowerShell, VBScript, JavaScript, Batch) that hides its commands by encoding, or borrows system tools (certutil, mshta and so on), to download and run code without being noticed.', 'อย่ารันสคริปต์ อ่านคำสั่งที่ถอดรหัสแล้วในหน้านี้ ถ้าไม่เข้าใจให้ลบทิ้ง', 'Do not run it. Read the decoded commands on this page, and delete it if you do not understand them.'],
  phishing: ['ฟิชชิง (หลอกเอาข้อมูล)', 'Phishing', 'หน้าเว็บหรือลิงก์ที่ปลอมเป็นธนาคาร บริการขนส่ง หรือแบรนด์ดัง เพื่อให้คุณกรอกรหัสผ่าน OTP หรือข้อมูลบัตร แล้วส่งให้ผู้โจมตีทันที', 'A page or link that pretends to be a bank, courier or well-known brand so you type your password, OTP or card details, which go straight to the attacker.', 'อย่ากรอกข้อมูลใดๆ เข้าเว็บที่ลิงก์ไป หากกรอกไปแล้วให้เปลี่ยนรหัสผ่านทันทีและแจ้งธนาคาร', 'Do not enter anything. If you already did, change the password at once and tell your bank.'],
  packed: ['ไฟล์ถูกแพ็ก / ทำให้อ่านยาก', 'Packed / obfuscated', 'ถูกบีบอัดหรือเข้ารหัสทับโค้ดจริง จะคลายตัวเองตอนรัน ซอฟต์แวร์เชิงพาณิชย์บางตัวทำ แต่มัลแวร์ใช้บ่อยเพื่อหลบการตรวจแบบลายเซ็น', 'Compressed or encrypted over the real code, which unpacks itself at run time. Some commercial software does this, but malware uses it a lot to dodge signature checks.', 'ตรวจที่มาของไฟล์ ถ้าไม่แน่ใจให้รันในเครื่องเสมือนเท่านั้น', 'Check where the file came from. If unsure, run it in a virtual machine only.'],
  android: ['มัลแวร์ Android', 'Android malware', 'แอปที่ขอสิทธิ์ Accessibility, แสดงทับแอปอื่น และอ่าน SMS มักเป็นมัลแวร์ธนาคารที่ปลอมหน้าจอแอปจริง ดักรหัส OTP และโอนเงินออกโดยไม่รู้ตัว', 'An app asking for Accessibility, screen overlay and SMS access is typically a banking trojan that fakes real app screens, intercepts OTP codes and moves money without you noticing.', 'อย่าติดตั้ง ถ้าติดตั้งแล้วให้ถอนสิทธิ์ Accessibility ถอนการติดตั้ง และติดต่อธนาคารทันที', 'Do not install it. If you did, remove its Accessibility permission, uninstall it and call your bank right away.'],
  masq: ['ปลอมนามสกุลหรือชนิดไฟล์', 'Disguised file type', 'ไฟล์ที่ทำให้ดูเหมือนรูปหรือเอกสาร (เช่น invoice.pdf.exe หรือ .exe ที่ตั้งชื่อ .jpg) เพื่อให้คุณเปิดโดยไม่ระวัง เป็นกลวิธีมาตรฐานของมัลแวร์ที่ส่งทางอีเมลและแชท', 'A file made to look like a picture or document (for example invoice.pdf.exe, or an .exe named .jpg) so you open it without care. A standard trick in email and chat malware.', 'อย่าเปิด ตรวจดูนามสกุลจริงของไฟล์ และขอไฟล์ต้นฉบับจากผู้ส่งผ่านช่องทางอื่น', 'Do not open it. Check the real extension and ask the sender for the original through another channel.'],
  spyware: ['สปายแวร์ / คีย์ล็อกเกอร์', 'Spyware / keylogger', 'แอบบันทึกการกดแป้นพิมพ์ ภาพหน้าจอ หรือเสียง เพื่อเก็บรหัสผ่านและข้อมูลส่วนตัวไปให้ผู้อื่น', 'Secretly records keystrokes, screenshots or audio to collect passwords and private data for someone else.', 'ลบไฟล์ สแกนทั้งเครื่อง และเปลี่ยนรหัสผ่านจากเครื่องอื่น', 'Delete the file, scan the whole machine and change passwords from another device.'],
  wiper: ['มัลแวร์ทำลายข้อมูล', 'Wiper', 'คำสั่งที่ลบหรือเขียนทับข้อมูลหรือทำให้ระบบล่ม โดยไม่มีเจตนาเรียกค่าไถ่ ต่างจากแรนซัมแวร์ที่ยังเปิดทางให้กู้คืน', 'Commands that erase or overwrite data or crash the system, with no ransom intended, unlike ransomware that at least offers a way back.', 'อย่ารันบนเครื่องจริง ตรวจดูคำสั่งในหน้านี้ และสำรองข้อมูลแยกไว้เสมอ', 'Never run it on a real machine. Read the commands on this page and keep separate backups.'],
  suspicious: ['ลักษณะผิดปกติ', 'Suspicious traits', 'พบลักษณะที่ซอฟต์แวร์ปกติไม่ค่อยมี แต่ยังไม่ตรงกับมัลแวร์ตัวใดโดยเฉพาะ', 'Traits that normal software rarely has, but not matching any one malware family.', 'อ่านรายการที่พบ และตัดสินใจตามความน่าเชื่อถือของแหล่งที่มา', 'Read the findings and decide based on how much you trust the source.'],
  info: ['ข้อมูลประกอบ', 'Notes', 'ข้อมูลประกอบที่ไม่ได้บอกว่าอันตราย', 'Context that does not by itself mean danger.', '', '']
};
const catLabel = c => (CAT[c] || CAT.suspicious)[LANG === 'th' ? 0 : 1], catHow = c => (CAT[c] || CAT.suspicious)[LANG === 'th' ? 2 : 3], catAct = c => (CAT[c] || CAT.suspicious)[LANG === 'th' ? 4 : 5];

D('h.pe.anom', 'โครงสร้างไฟล์ปฏิบัติการผิดปกติจากมาตรฐาน', 'The executable structure deviates from the standard');
D('h.pe.packed', 'ไฟล์ปฏิบัติการดูเหมือนถูกบีบอัดหรือเข้ารหัสเพื่อซ่อนโค้ดจริง ซอฟต์แวร์ปกติบางตัวก็ทำ แต่มัลแวร์ใช้บ่อยเพื่อหลบการตรวจ', 'The executable looks packed or encrypted to hide its real code. Some normal software does this, but malware uses it often to evade detection.');

D('h.pe.dotnet', 'เป็นโปรแกรม .NET', 'This is a .NET program.');

D('h.pdf.nameobf', 'PDF ใช้การเข้ารหัสอักขระในชื่อออบเจ็กต์ ({n} จุด) เพื่อซ่อนคำสั่งอย่าง /JavaScript จากตัวตรวจ', 'The PDF escapes characters inside object names ({n} places) to hide keywords like /JavaScript from scanners.');
D('h.pdf.enc', 'PDF ถูกเข้ารหัส เนื้อหาบางส่วนจึงตรวจไม่ได้', 'The PDF is encrypted, so part of its content cannot be inspected.');

/* description text for a finding in the current language */
function describe(f) {
  if (f.note && f.note[LANG]) return f.note[LANG];
  if (f.k && has18(f.k)) return t(f.k, f.p || {});
  return '';
}
function reasonLines(f) {
  const list = f.p && f.p.list; if (!Array.isArray(list)) return [];
  return list.map(r => t(r.k, r.p || {}));
}

function csvCell(v) {

}
function buildCsv(r) {

  const rows = [head];
  const base = [subjectLabel(r), r.kind, r.verdict, r.score];
  const fs = r.findings.filter(f => f.w > 0 || f.cat === 'test' || f.cat === 'info');
  if (r.kind === 'hash') for (const i of (r.items || [])) rows.push([i.hash, 'hash', i.match ? r.verdict : 'unknown', r.score, i.match ? 'crit' : '', i.match ? i.match.n : '', i.match ? i.match.cat : '', 'ioc', '', '', '', '', '', '', i.algo || 'invalid', '']);
  else if (!fs.length) rows.push([...base, '', '', '', '', '', '', '', '', '', '', '']);
  else for (const f of fs) { const w = f.where || {}; rows.push([...base, f.sev, f.name, f.cat, f.layer, w.path || '', w.entry || '', w.section || '', w.off !== undefined ? '0x' + hex(w.off) : '', w.line || '', w.part || '', describe(f), (f.att || []).join(' ')]); }

function applyAttrs(el, attrs) {
  if (!attrs) return;

    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
